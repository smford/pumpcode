<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="PumpCode - Real-time UK fuel price tracker for forecourts and filling stations. Find the cheapest Unleaded E10, Diesel B7, and Super E5 nearby.">
  <title>PumpCode | UK Fuel Price Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PumpCode">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <script>
    (function () {
      const saved = localStorage.getItem('pumpcode-theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && systemDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-inner container">
      <div class="brand-group">
        <div class="logo-icon-box" aria-hidden="true">
          <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-label="PumpCode Logo">
            <path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
          </svg>
        </div>
        <div>
          <h1 class="logo-text">Pump<span class="logo-accent">Code</span></h1>
          <span class="tagline">UK Fuel Tracker</span>
        </div>
      </div>

      <div class="header-actions">
        <div id="freshness-badge" class="freshness-pill" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="freshness-label">Checking...</span>
        </div>
        <button id="btn-pwa-install" class="btn-install-pwa" type="button" aria-label="Install PumpCode App" title="Install PumpCode App" hidden>
          <svg class="install-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span class="install-text">Install</span>
        </button>
        <button id="theme-toggle" class="btn-theme-toggle" type="button" aria-label="Toggle display theme" title="Toggle theme">
          <svg class="theme-icon light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
          <svg class="theme-icon dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container main-content">
    <!-- Hero / Search Section -->
    <section class="search-panel" aria-label="Search Forecourts">
      <form id="search-form" class="search-form" role="search" onsubmit="return false;">
        <div class="search-bar-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <label for="outcode-search" class="visually-hidden">Search by UK postcode or outcode</label>
          <input
            type="search"
            id="outcode-search"
            class="search-input"
            placeholder="Search town, postcode or outcode (e.g. CV3 4AR, SW1A)..."
            autocomplete="off"
            spellcheck="false"
          >
          <button id="locate-btn" class="inline-locate-btn" type="button" title="Use current location" aria-label="Use current location">
            <svg class="locate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="3"/>
              <line x1="12" y1="2" x2="12" y2="5"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="5" y2="12"/>
              <line x1="19" y1="12" x2="22" y2="12"/>
            </svg>
          </button>
          <button id="search-btn" class="search-submit-btn" type="submit">
            Search
          </button>
          <div id="autocomplete-list" class="autocomplete-dropdown" role="listbox" hidden></div>
        </div>
      </form>

      <!-- Fuel Grade Filter Bar -->
      <div class="filters-bar">
        <fieldset class="segmented-grade-control" aria-label="Select Fuel Grade">
          <legend class="visually-hidden">Fuel Grade</legend>
          <input type="radio" id="grade-e10" name="fuel-grade" value="E10" checked>
          <label for="grade-e10" class="grade-pill">Unleaded (E10)</label>

          <input type="radio" id="grade-b7" name="fuel-grade" value="B7">
          <label for="grade-b7" class="grade-pill">Diesel (B7)</label>

          <input type="radio" id="grade-e5" name="fuel-grade" value="E5">
          <label for="grade-e5" class="grade-pill">Super (E5)</label>
        </fieldset>
      </div>
    </section>

    <!-- Status Alert Container -->
    <section id="status-container" class="status-container" aria-live="polite"></section>

    <!-- Results Section -->
    <section id="results-section" class="results-section" aria-label="Nearby Forecourts">
      <!-- District Overview Bar -->
      <div class="district-overview" id="results-header" hidden>
        <div class="district-title-box">
          <h2 id="results-title" class="district-title">Forecourts</h2>
          <span id="results-count" class="badge-count">0 stations</span>
        </div>

        <div id="results-summary" class="stats-pills-row">
          <!-- Populated by JS: Lowest, Average, Spread -->
        </div>
      </div>

      <!-- Forecourt Cards Grid -->
      <div id="stations-grid" class="forecourts-grid">
        <!-- Station Cards rendered by app.js -->
      </div>
    </section>
  </main>

  <script src="app.js?v=12"></script>
</body>
</html>
